<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:">
<title>Quest</title>
<style>
  /* Palette shared with index.html, sampled from the game's own task panel. */
  :root {
    --frame: #2a2a2a;
    --panel: #101010;
    --strip: #1c1c1c;
    --row: #303030;
    --row-hi: #3a3a3a;
    --amber: #b07a1c;
    --amber-hi: #d99a2b;
    --text: #e8e4da;
    --text-dim: #9a9a9a;
  }
  @font-face {
    font-family: "ErikaOrmig";
    src: url("fonts/ErikaOrmig.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }
  * { box-sizing: border-box; }
  html { font-size: calc(10px + 0.7vh); }
  /* The mod shows the page in a small card rect, so everything outside the card stays transparent. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: "ErikaOrmig", "Courier New", Courier, monospace;
    color: var(--text);
    user-select: none;
  }
  [hidden] { display: none !important; }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    background: transparent;
  }
  .card {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: var(--panel);
    border: 1px solid var(--frame);
  }
  .title {
    padding: 0.55rem 0 0.45rem;
    background: var(--strip);
    border-bottom: 2px solid var(--amber);
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: normal;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }
  .inner {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 1rem;
  }
  .text {
    margin: 0;
    overflow: auto;
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.5;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  .acts { margin: auto 0 0; }
  .act {
    font: inherit;
    width: 100%;
    min-height: 3rem;
    padding: 0.7rem 0.9rem;
    font-size: 0.9rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    color: var(--text);
    background: var(--row);
    border: 1px solid var(--row-hi);
    border-radius: 0;
    cursor: pointer;
  }
  .act:hover, .act:focus, .act:focus-visible {
    outline: none;
    color: #14100a;
    background: var(--amber);
    border-color: var(--amber-hi);
  }
  .hint {
    margin: 0.5rem 0 0;
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="stage" id="stage" hidden>
  <main class="card">
    <header class="title"><h1 id="title">Quest</h1></header>
    <div class="inner">
      <p class="text" id="text"></p>
      <nav class="acts"><button class="act" id="ok" type="button">OK</button></nav>
      <p class="hint">Esc or OK closes this</p>
    </div>
  </main>
</div>
<script>
(function () {
  "use strict";
  var bridge = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
  var seq = 0;

  function $(id) { return document.getElementById(id); }

  function send(message) {
    if (bridge) bridge.postMessage(message);
  }

  function hide() {
    $("stage").hidden = true;
  }

  // The ok carries the sequence of the card that was up, so a late ok cannot dismiss the next card.
  function close() {
    hide();
    send({ type: "ok", seq: seq });
  }

  function show(message) {
    seq = message.seq || 0;
    $("title").textContent = message.title || "Quest";
    $("text").textContent = message.text || "";
    $("stage").hidden = false;
    try { $("ok").focus({ preventScroll: true }); } catch (e) { }
  }

  $("ok").addEventListener("click", close);

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" || event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      close();
    }
  });

  if (bridge) {
    bridge.addEventListener("message", function (event) {
      var message = event.data;
      if (!message) return;
      if (message.type === "notice") show(message);
    });
    send({ type: "ready" });
  }
})();
</script>
</body>
</html>
